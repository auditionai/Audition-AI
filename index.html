    <title>Audition AI Studio - App Tạo Ảnh & Video AI 2026</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-32R3PLY2JT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-32R3PLY2JT', { send_page_view: false });

    <!-- Process Env Shim for Browser Compatibility -->
    <script>
      window.process = window.process || { env: { API_KEY: '' } };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Be Vietnam Pro"', 'Inter', 'system-ui', 'sans-serif'],
              game: ['"Be Vietnam Pro"', 'Inter', 'system-ui', 'sans-serif'],
              accent: ['"Be Vietnam Pro"', 'Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              audi: {
                pink: '#FF007F',    // Electric Cyber Pink
                purple: '#9D00FF',  // Deep Cyber Purple
                cyan: '#00F2FE',    // Neon Cyber Cyan
                lime: '#00FF87',    // Vibrant Neon Lime
                yellow: '#FFB800',  // Gold Item
                dark: '#0B0D14',    // Midnight Obsidian
                glass: 'rgba(255, 255, 255, 0.05)'
              }
            },
            animation: {
              'beat': 'beat 0.6s infinite cubic-bezier(0.2, 0.6, 0.35, 1)',
              'float': 'float 4s ease-in-out infinite',
              'float-fast': 'float 2.5s ease-in-out infinite',
              'spin-slow': 'spin 8s linear infinite',
              'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-in-right': 'slideInRight 0.4s ease-out forwards',
            },
            keyframes: {
              beat: {
                '0%, 100%': { transform: 'scale(1)' },
                '15%': { transform: 'scale(1.08)' },
                '30%': { transform: 'scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.6', filter: 'drop-shadow(0 0 15px rgba(0, 242, 254, 0.4))' },
                '50%': { opacity: '1', filter: 'drop-shadow(0 0 25px rgba(255, 0, 127, 0.7))' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(8px)' },
                '100%': { opacity: '1', transform: 'none' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(30px)' },
                '100%': { opacity: '1', transform: 'none' },
              }
            }
          },
        },
      }
    </script>
    <style>
      /* DESIGN SYSTEM 3.0 - MATTE PLATINUM SLATE LIGHT THEME & OBSIDIAN DARK THEME */
      :root {
        --neu-bg: #CFD5E1;        /* Soft matte warm platinum slate - 0% glare */
        --neu-surface: #DFE4ED;   /* Matte slate card surface - NO PURE WHITE */
        --neu-shadow-dark: rgba(15, 23, 42, 0.20);
        --neu-shadow-light: #EEF2F8;
        --neu-text-primary: #000000;   /* Ultra black 100% sharp contrast */
        --neu-text-secondary: #0F172A; /* Deep charcoal slate */
        --neu-text-muted: #1E293B;     /* Crisp readable dark text */
        --neu-border: #B4BFD2;        /* Soft subtle border */
        --neu-accent: #E11D48;
      }

      .dark {
        --neu-bg: #0B0D14;
        --neu-surface: #151824;
        --neu-shadow-dark: rgba(0, 0, 0, 0.9);
        --neu-shadow-light: rgba(255, 255, 255, 0.05);
        --neu-text-primary: #FFFFFF;
        --neu-text-secondary: #F1F5F9;
        --neu-text-muted: #CBD5E1;
        --neu-border: rgba(255, 255, 255, 0.14);
        --neu-accent: #00F2FE;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--neu-bg);
        color: var(--neu-text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      #root {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
      }
      
      body {
        -webkit-tap-highlight-color: transparent;
      }

      /* 3D NEUMORPHISM 2.0 UTILITY CLASSES */
      .neu-base {
        background-color: var(--neu-bg);
        color: var(--neu-text-primary);
      }
      .neu-surface {
        background-color: var(--neu-surface);
      }

      /* Raised 3D Surface Depth */
      .neu-raised-sm {
        background: var(--neu-surface);
        box-shadow: 4px 4px 10px var(--neu-shadow-dark), -4px -4px 10px var(--neu-shadow-light);
        border: 1px solid var(--neu-border);
      }
      .neu-raised-md {
        background: var(--neu-surface);
        box-shadow: 8px 8px 18px var(--neu-shadow-dark), -8px -8px 18px var(--neu-shadow-light);
        border: 1px solid var(--neu-border);
      }
      .neu-raised-lg {
        background: var(--neu-surface);
        box-shadow: 12px 12px 24px var(--neu-shadow-dark), -12px -12px 24px var(--neu-shadow-light);
        border: 1px solid var(--neu-border);
      }
      .neu-raised-xl {
        background: var(--neu-surface);
        box-shadow: 16px 16px 36px var(--neu-shadow-dark), -16px -16px 36px var(--neu-shadow-light);
        border: 1px solid var(--neu-border);
      }

      /* Inset 3D Sunken Wells */
      .neu-inset-sm {
        background: var(--neu-bg);
        box-shadow: inset 3px 3px 6px var(--neu-shadow-dark), inset -3px -3px 6px var(--neu-shadow-light);
      }
      .neu-inset-md {
        background: var(--neu-bg);
        box-shadow: inset 6px 6px 14px var(--neu-shadow-dark), inset -6px -6px 14px var(--neu-shadow-light);
      }

      /* Tactile Buttons */
      .neu-button {
        background: var(--neu-surface);
        box-shadow: 6px 6px 14px var(--neu-shadow-dark), -6px -6px 14px var(--neu-shadow-light);
        border: 1px solid var(--neu-border);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .neu-button:hover {
        transform: translateY(-2px);
        box-shadow: 8px 8px 18px var(--neu-shadow-dark), -8px -8px 18px var(--neu-shadow-light);
      }
      .neu-button:active, .neu-button-active {
        transform: translateY(0);
        box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
      }

      /* Cyber Gradient Buttons */
      .neu-button-primary {
        background: linear-gradient(135deg, #FF007F 0%, #9D00FF 50%, #00F2FE 100%);
        color: #FFFFFF;
        box-shadow: 0 4px 18px rgba(255, 0, 127, 0.45);
        transition: all 0.25s ease;
      }
      .neu-button-primary:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 8px 24px rgba(0, 242, 254, 0.55);
      }

      .neu-button-accent {
        background: linear-gradient(135deg, #00F2FE 0%, #00FF87 100%);
        color: #0B0D14;
        font-weight: 800;
        box-shadow: 0 4px 16px rgba(0, 242, 254, 0.4);
        transition: all 0.25s ease;
      }

      /* Inputs */
      .neu-input {
        background: var(--neu-bg);
        box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), inset -4px -4px 8px var(--neu-shadow-light);
        border: 1px solid transparent;
        color: var(--neu-text-primary);
        transition: all 0.25s ease;
      }
      .neu-input:focus {
        outline: none;
        border-color: #00F2FE;
        box-shadow: inset 4px 4px 8px var(--neu-shadow-dark), 0 0 16px rgba(0, 242, 254, 0.4);
      }

      /* Cards */
      .neu-card {
        background: var(--neu-surface);
        box-shadow: 10px 10px 24px var(--neu-shadow-dark), -10px -10px 24px var(--neu-shadow-light);
        border-radius: 24px;
        border: 1px solid var(--neu-border);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .neu-card:hover {
        transform: translateY(-3px);
        box-shadow: 14px 14px 30px var(--neu-shadow-dark), -14px -14px 30px var(--neu-shadow-light);
      }

      /* Neon Glow Border Effects */
      .cyber-glow-pink {
        box-shadow: 0 0 20px rgba(255, 0, 127, 0.35);
        border-color: rgba(255, 0, 127, 0.6);
      }
      .cyber-glow-cyan {
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
        border-color: rgba(0, 242, 254, 0.6);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--neu-bg);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #FF007F, #00F2FE);
        border-radius: 6px;
      }
    </style>

</script>
