services:
  - type: web
    name: audition-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run render:web
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: VITE_R2_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GOOGLE_CLOUD_LOCATION
        value: global
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: VITE_CAULENHAU_SUPABASE_URL
        sync: false
      - key: VITE_CAULENHAU_SUPABASE_ANON_KEY
        sync: false
      - key: CAULENHAU_SUPABASE_URL
        sync: false
      - key: CAULENHAU_SUPABASE_ANON_KEY
        sync: false
      - key: TST_API_KEY
        sync: false
      - key: GPTI2_API_KEY
        sync: false
      - key: GOMMO_ACCESS_TOKEN
        sync: false
      - key: GOMMO_DOMAIN
        value: vmedia.ai
      - key: GOMMO_PROJECT_ID
        value: default
      - key: GENERATION_PROVIDER_DEFAULT
        value: tst
      - key: PAYMENT_GATEWAY
        value: sepay
      - key: SEPAY_ENV
        value: production
      - key: SEPAY_MERCHANT_ID
        sync: false
      - key: SEPAY_SECRET_KEY
        sync: false
      - key: SEPAY_API_TOKEN
        sync: false
      - key: SEPAY_PAYMENT_METHOD
        value: BANK_TRANSFER
      - key: SEPAY_SUCCESS_URL
        sync: false
      - key: SEPAY_ERROR_URL
        sync: false
      - key: SEPAY_CANCEL_URL
        sync: false
      - key: SEPAY_IPN_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SEPAY_RECONCILE_SECRET
        sync: false
      - key: TELEGRAM_NOTIFY_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_NOTIFY_WEBHOOK_SECRET
        sync: false
      - key: QUEUE_WORKER_MODE
        value: dedicated
      - key: DISABLE_BACKGROUND_QUEUE_TRIGGER
        value: "true"

  - type: worker
    name: audition-queue-worker
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci
    startCommand: npm run render:queue-worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TST_API_KEY
        sync: false
      - key: GPTI2_API_KEY
        sync: false
      - key: GOMMO_ACCESS_TOKEN
        sync: false
      - key: GOMMO_DOMAIN
        value: vmedia.ai
      - key: GOMMO_PROJECT_ID
        value: default
      - key: GENERATION_PROVIDER_DEFAULT
        value: tst
      - key: SEPAY_MERCHANT_ID
        sync: false
      - key: SEPAY_SECRET_KEY
        sync: false
      - key: SEPAY_API_TOKEN
        sync: false
      - key: SEPAY_ENV
        value: production
      - key: SEPAY_PAYMENT_METHOD
        value: BANK_TRANSFER
      - key: TELEGRAM_NOTIFY_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_NOTIFY_WEBHOOK_SECRET
        sync: false
      - key: RENDER_QUEUE_WORKER_LANE
        value: all
